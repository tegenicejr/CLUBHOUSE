<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Oh LOVE games - CLUB HOUSE</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ヘッダー（右上に歯車ボタンのみ配置） -->
  <header>
    <div class="brand-title">Oh LOVE games</div>
    <div class="header-right">
      <button id="btn-settings-open" class="gear-btn" aria-label="Settings">⚙️</button>
    </div>
  </header>

  <!-- メイン画面 -->
  <main>
    <div class="hero">
      <div class="club-symbol">
        <svg viewBox="0 0 100 100" class="symbol-svg">
          <circle cx="50" cy="50" r="46" fill="none" stroke="#e2a85c" stroke-width="3" opacity="0.3"/>
          <path d="M50 20 C36 20 26 30 26 43 C26 53 34 61 43 64 L38 80 L62 80 L57 64 C66 61 74 53 74 43 C74 30 64 20 50 20 Z" fill="#e2a85c"/>
          <circle cx="33" cy="44" r="11" fill="#e2a85c"/>
          <circle cx="67" cy="44" r="11" fill="#e2a85c"/>
        </svg>
      </div>
      <h1 id="title-text">CLUB HOUSE</h1>
      <p id="desc-text" class="subtitle">ボードゲーム・パズルコレクション</p>
    </div>

    <!-- ゲーム選択カード -->
    <div class="game-grid">
      <!-- 2048 -->
      <a href="2048/index.html" class="game-card">
        <div class="card-inner">
          <div class="game-icon-box">
            <span class="tile-mock">2048</span>
          </div>
          <div class="game-meta">
            <h2>2048</h2>
            <p id="card-desc-2048">タイルを重ねて伝説の数字を目指すパズル</p>
          </div>
        </div>
      </a>

      <!-- バックギャモン -->
      <a href="backgammon/index.html" class="game-card">
        <div class="card-inner">
          <div class="game-icon-box dice-box">
            <span class="dice-mock red-dot">⚀</span>
            <span class="dice-mock">⚅</span>
          </div>
          <div class="game-meta">
            <h2>Backgammon</h2>
            <p id="card-desc-bg">サイコロと戦略の伝統ボードゲーム</p>
          </div>
        </div>
      </a>
    </div>
  </main>

  <!-- ⚙️ 設定モーダル -->
  <div id="settings-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modal-settings-title">⚙️ 設定</h2>
        <button id="btn-close-modal" class="close-x-btn">✕</button>
      </div>
      
      <div class="modal-body">
        <!-- 1. 言語選択 (8言語) -->
        <div class="setting-row">
          <label id="lbl-lang">言語 (Language)</label>
          <select id="select-lang" class="custom-select">
            <option value="ja">日本語</option>
            <option value="en">English</option>
            <option value="zh-CN">简体中文</option>
            <option value="zh-TW">繁體中文</option>
            <option value="ko">한국어</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
            <option value="pt">Português</option>
          </select>
        </div>

        <!-- 2. サウンド (効果音) -->
        <div class="setting-row">
          <label id="lbl-sound">効果音 (Sound FX)</label>
          <div class="btn-group">
            <button id="btn-sound-on" class="toggle-choice-btn">ON</button>
            <button id="btn-sound-off" class="toggle-choice-btn">OFF</button>
          </div>
        </div>

        <!-- 3. 振動 (バイブレーション) -->
        <div class="setting-row">
          <label id="lbl-vib">振動 (Vibration)</label>
          <div class="btn-group">
            <button id="btn-vib-on" class="toggle-choice-btn">ON</button>
            <button id="btn-vib-off" class="toggle-choice-btn">OFF</button>
          </div>
        </div>

        <!-- 4. アニメーション速度 -->
        <div class="setting-row">
          <label id="lbl-speed">アニメーション速度</label>
          <div class="btn-group">
            <button id="btn-speed-normal" class="toggle-choice-btn">通常</button>
            <button id="btn-speed-fast" class="toggle-choice-btn">高速</button>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button id="btn-modal-close-bottom" class="primary-btn">とじる</button>
      </div>
    </div>
  </div>

  <script>
    // 8言語対応辞書
    const I18N = {
      ja: {
        title: 'CLUB HOUSE',
        subtitle: 'ボードゲーム・パズルコレクション',
        desc2048: 'タイルを重ねて伝説の数字を目指すパズル',
        descBg: 'サイコロと戦略の伝統ボードゲーム',
        settingsTitle: '⚙️ 設定',
        langLabel: '言語 (Language)',
        soundLabel: '効果音 (Sound FX)',
        vibLabel: '振動 (Vibration)',
        speedLabel: 'アニメーション速度',
        speedNormal: '通常',
        speedFast: '高速',
        close: 'とじる'
      },
      en: {
        title: 'CLUB HOUSE',
        subtitle: 'Board Game & Puzzle Collection',
        desc2048: 'Merge tiles to reach the legend.',
        descBg: 'Classic dice & strategy board game.',
        settingsTitle: '⚙️ Settings',
        langLabel: 'Language',
        soundLabel: 'Sound FX',
        vibLabel: 'Vibration',
        speedLabel: 'Animation Speed',
        speedNormal: 'Normal',
        speedFast: 'Fast',
        close: 'Close'
      },
      'zh-CN': {
        title: 'CLUB HOUSE',
        subtitle: '桌游与益智游戏馆',
        desc2048: '合并方块，挑战传说中的数字。',
        descBg: '骰子与策略的经典双陆棋。',
        settingsTitle: '⚙️ 设置',
        langLabel: '语言',
        soundLabel: '音效',
        vibLabel: '震动',
        speedLabel: '动画速度',
        speedNormal: '正常',
        speedFast: '快速',
        close: '关闭'
      },
      'zh-TW': {
        title: 'CLUB HOUSE',
        subtitle: '桌遊與益智遊戲館',
        desc2048: '合併方塊，挑戰傳說中的數字。',
        descBg: '骰子與策略的經典雙陸棋。',
        settingsTitle: '⚙️ 設定',
        langLabel: '語言',
        soundLabel: '音效',
        vibLabel: '震動',
        speedLabel: '動畫速度',
        speedNormal: '正常',
        speedFast: '快速',
        close: '關閉'
      },
      ko: {
        title: 'CLUB HOUSE',
        subtitle: '보드게임 & 퍼즐 컬렉션',
        desc2048: '타일을 합쳐 전설의 숫자에 도달하세요.',
        descBg: '주사위와 전략의 전통 보드게임.',
        settingsTitle: '⚙️ 설정',
        langLabel: '언어',
        soundLabel: '효과음',
        vibLabel: '진동',
        speedLabel: '애니메이션 속도',
        speedNormal: '보통',
        speedFast: '빠름',
        close: '닫기'
      },
      es: {
        title: 'CLUB HOUSE',
        subtitle: 'Colección de Juegos de Mesa y Puzzles',
        desc2048: 'Combina fichas para alcanzar la leyenda.',
        descBg: 'Juego de mesa clásico de dados y estrategia.',
        settingsTitle: '⚙️ Ajustes',
        langLabel: 'Idioma',
        soundLabel: 'Efectos de sonido',
        vibLabel: 'Vibración',
        speedLabel: 'Velocidad',
        speedNormal: 'Normal',
        speedFast: 'Rápido',
        close: 'Cerrar'
      },
      fr: {
        title: 'CLUB HOUSE',
        subtitle: 'Collection de Jeux de Société et Casse-têtes',
        desc2048: 'Fusionnez les tuiles pour atteindre la légende.',
        descBg: 'Jeu de dés et de stratégie classique.',
        settingsTitle: '⚙️ Paramètres',
        langLabel: 'Langue',
        soundLabel: 'Effets sonores',
        vibLabel: 'Vibration',
        speedLabel: 'Vitesse',
        speedNormal: 'Normale',
        speedFast: 'Rapide',
        close: 'Fermer'
      },
      pt: {
        title: 'CLUB HOUSE',
        subtitle: 'Coleção de Jogos de Tabuleiro e Enigmas',
        desc2048: 'Junte as peças até alcançar a lendária.',
        descBg: 'Jogo clássico de dados e estratégia.',
        settingsTitle: '⚙️ Configurações',
        langLabel: 'Idioma',
        soundLabel: 'Efeitos sonoros',
        vibLabel: 'Vibration',
        speedLabel: 'Velocidade',
        speedNormal: 'Normal',
        speedFast: 'Rápido',
        close: 'Fechar'
      }
    };

    class ClubHouseApp {
      constructor() {
        // 保存された設定の読み込み（2048キーとも同期）
        this.currentLang = localStorage.getItem('2048_lang') || localStorage.getItem('clubhouse_lang') || 'ja';
        this.isMuted = (localStorage.getItem('2048_muted') || localStorage.getItem('clubhouse_muted')) === 'true';
        this.isVib = (localStorage.getItem('2048_vibration') || localStorage.getItem('clubhouse_vibration')) !== 'false';
        this.speed = localStorage.getItem('2048_speed') || localStorage.getItem('clubhouse_speed') || 'normal';

        this.initDOMElements();
        this.applyLanguage();
        this.updateSettingsUI();
        this.bindEvents();
      }

      initDOMElements() {
        this.titleText = document.getElementById('title-text');
        this.descText = document.getElementById('desc-text');
        this.desc2048 = document.getElementById('card-desc-2048');
        this.descBg = document.getElementById('card-desc-bg');

        this.modal = document.getElementById('settings-modal');
        this.btnSettingsOpen = document.getElementById('btn-settings-open');
        this.btnCloseModal = document.getElementById('btn-close-modal');
        this.btnCloseBottom = document.getElementById('btn-modal-close-bottom');

        this.selectLang = document.getElementById('select-lang');
        this.btnSoundOn = document.getElementById('btn-sound-on');
        this.btnSoundOff = document.getElementById('btn-sound-off');
        this.btnVibOn = document.getElementById('btn-vib-on');
        this.btnVibOff = document.getElementById('btn-vib-off');
        this.btnSpeedNormal = document.getElementById('btn-speed-normal');
        this.btnSpeedFast = document.getElementById('btn-speed-fast');

        this.settingsTitle = document.getElementById('modal-settings-title');
        this.lblLang = document.getElementById('lbl-lang');
        this.lblSound = document.getElementById('lbl-sound');
        this.lblVib = document.getElementById('lbl-vib');
        this.lblSpeed = document.getElementById('lbl-speed');
      }

      applyLanguage() {
        const t = I18N[this.currentLang] || I18N.ja;
        document.documentElement.lang = this.currentLang;

        this.titleText.textContent = t.title;
        this.descText.textContent = t.subtitle;
        this.desc2048.textContent = t.desc2048;
        this.descBg.textContent = t.descBg;

        this.settingsTitle.textContent = t.settingsTitle;
        this.lblLang.textContent = t.langLabel;
        this.lblSound.textContent = t.soundLabel;
        this.lblVib.textContent = t.vibLabel;
        this.lblSpeed.textContent = t.speedLabel;
        this.btnSpeedNormal.textContent = t.speedNormal;
        this.btnSpeedFast.textContent = t.speedFast;
        this.btnCloseBottom.textContent = t.close;

        this.selectLang.value = this.currentLang;
      }

      updateSettingsUI() {
        this.btnSoundOn.classList.toggle('active', !this.isMuted);
        this.btnSoundOff.classList.toggle('active', this.isMuted);

        this.btnVibOn.classList.toggle('active', this.isVib);
        this.btnVibOff.classList.toggle('active', !this.isVib);

        this.btnSpeedNormal.classList.toggle('active', this.speed === 'normal');
        this.btnSpeedFast.classList.toggle('active', this.speed === 'fast');
      }

      // 他のゲーム（2048、バックギャモンなど）へ即座に値を同期保存
      syncSettings() {
        // クラブハウス全体キー
        localStorage.setItem('clubhouse_lang', this.currentLang);
        localStorage.setItem('clubhouse_muted', this.isMuted);
        localStorage.setItem('clubhouse_vibration', this.isVib);
        localStorage.setItem('clubhouse_speed', this.speed);

        // 2048専用キー（2048側でそのまま読み込まれます）
        localStorage.setItem('2048_lang', this.currentLang);
        localStorage.setItem('2048_muted', this.isMuted);
        localStorage.setItem('2048_vibration', this.isVib);
        localStorage.setItem('2048_speed', this.speed);

        // バックギャモンキー
        localStorage.setItem('bg_lang', this.currentLang);
        localStorage.setItem('bg_muted', this.isMuted);
        localStorage.setItem('bg_vibration', this.isVib);
        localStorage.setItem('bg_speed', this.speed);
      }

      bindEvents() {
        // ⚙️ボタンでモーダル表示
        this.btnSettingsOpen.addEventListener('click', () => {
          this.modal.classList.remove('hidden');
        });

        // モーダルを閉じる
        const closeModal = () => this.modal.classList.add('hidden');
        this.btnCloseModal.addEventListener('click', closeModal);
        this.btnCloseBottom.addEventListener('click', closeModal);
        this.modal.addEventListener('click', (e) => {
          if (e.target === this.modal) closeModal();
        });

        // 言語変更
        this.selectLang.addEventListener('change', (e) => {
          this.currentLang = e.target.value;
          this.syncSettings();
          this.applyLanguage();
        });

        // サウンド ON / OFF
        this.btnSoundOn.addEventListener('click', () => {
          this.isMuted = false;
          this.syncSettings();
          this.updateSettingsUI();
        });
        this.btnSoundOff.addEventListener('click', () => {
          this.isMuted = true;
          this.syncSettings();
          this.updateSettingsUI();
        });

        // 振動 ON / OFF
        this.btnVibOn.addEventListener('click', () => {
          this.isVib = true;
          this.syncSettings();
          this.updateSettingsUI();
          if ('vibrate' in navigator) navigator.vibrate(10);
        });
        this.btnVibOff.addEventListener('click', () => {
          this.isVib = false;
          this.syncSettings();
          this.updateSettingsUI();
        });

        // 速度 通常 / 高速
        this.btnSpeedNormal.addEventListener('click', () => {
          this.speed = 'normal';
          this.syncSettings();
          this.updateSettingsUI();
        });
        this.btnSpeedFast.addEventListener('click', () => {
          this.speed = 'fast';
          this.syncSettings();
          this.updateSettingsUI();
        });
      }
    }

    document.addEventListener('DOMContentLoaded', () => new ClubHouseApp());
  </script>
</body>
</html>
