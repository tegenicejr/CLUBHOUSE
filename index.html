<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Oh LOVE games - CLUB HOUSE</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <style>
    /* SVGアイコン表示補正 */
    .game-icon-box svg {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 16px;
    }

    /* 歯車ボタンの押しやすさ向上 */
    .gear-btn {
      font-size: 24px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 10px;
      line-height: 1;
      touch-action: manipulation;
    }

    /* 設定モーダルの確実な表示制御 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header>
    <div class="brand-title">Oh LOVE games</div>
    <div class="header-right">
      <button id="btn-settings-open" class="gear-btn" type="button" aria-label="Settings">⚙️</button>
    </div>
  </header>

  <!-- メイン画面 -->
  <main>
    <div class="hero">
      <div class="club-symbol">
        <svg viewBox="0 0 100 100" class="symbol-svg">
          <circle cx="50" cy="50" r="46" fill="none" stroke="#e2a85c" stroke-width="3" opacity="0.3"/>
          <path d="M50 20 C36 20 26 30 26 43 C26 53 34 61 43 64 L38 80 L62 80 L57 64 C66 61 74 53 74 43 C74 30 64 20 50 20 Z" fill="#e2a85c"/>
          <circle cx="33" cy="44" r="11" fill="#e2a85c"/>
          <circle cx="67" cy="44" r="11" fill="#e2a85c"/>
        </svg>
      </div>
      <h1 id="title-text">CLUB HOUSE</h1>
      <p id="desc-text" class="subtitle">ボードゲーム・パズルコレクション</p>
    </div>

    <!-- ゲーム選択カード -->
    <div class="game-grid">
      <!-- 1. 2048 -->
      <a href="2048/index.html" class="game-card">
        <div class="card-inner">
          <div class="game-icon-box">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
              <defs>
                <radialGradient id="bg-2048" cx="50%" cy="20%" r="80%">
                  <stop offset="0%" stop-color="#fffdfa"/>
                  <stop offset="100%" stop-color="#e2d6c3"/>
                </radialGradient>
                <linearGradient id="tile-2048" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#f3cb42"/>
                  <stop offset="100%" stop-color="#e8be23"/>
                </linearGradient>
                <filter id="shadow-2048" x="-10%" y="-10%" width="130%" height="130%">
                  <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#ca9f10" flood-opacity="0.45"/>
                </filter>
              </defs>
              <rect width="512" height="512" rx="112" fill="url(#bg-2048)"/>
              <rect x="76" y="76" width="360" height="360" rx="64" fill="#ca9f10"/>
              <rect x="76" y="64" width="360" height="360" rx="64" fill="url(#tile-2048)" filter="url(#shadow-2048)"/>
              <text x="256" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="110" fill="#ffffff" text-anchor="middle" letter-spacing="-3">2048</text>
            </svg>
          </div>
          <div class="game-meta">
            <h2>2048</h2>
            <p id="card-desc-2048">タイルを重ねて伝説の数字を目指すパズル</p>
          </div>
        </div>
      </a>

      <!-- 2. バックギャモン -->
      <a href="backgammon/index.html" class="game-card">
        <div class="card-inner">
          <div class="game-icon-box">
            <svg class="title-symbol-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
              <defs>
                <radialGradient id="emblemBg" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="#1e4e32"/>
                  <stop offset="70%" stop-color="#143521"/>
                  <stop offset="100%" stop-color="#0a1c11"/>
                </radialGradient>
                <linearGradient id="brassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#fff2b2"/>
                  <stop offset="35%" stop-color="#d4af37"/>
                  <stop offset="70%" stop-color="#8a671c"/>
                  <stop offset="100%" stop-color="#e8ca74"/>
                </linearGradient>
                <radialGradient id="ivoryShade" cx="35%" cy="30%" r="70%">
                  <stop offset="0%" stop-color="#ffffff"/>
                  <stop offset="65%" stop-color="#eee6d3"/>
                  <stop offset="100%" stop-color="#b8aa88"/>
                </radialGradient>
                <radialGradient id="onyxShade" cx="35%" cy="30%" r="70%">
                  <stop offset="0%" stop-color="#464a52"/>
                  <stop offset="60%" stop-color="#1c1e22"/>
                  <stop offset="100%" stop-color="#08090a"/>
                </radialGradient>
                <filter id="checkerShadow" x="-30%" y="-30%" width="160%" height="160%">
                  <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.65"/>
                </filter>
              </defs>
              <rect x="10" y="10" width="180" height="180" rx="40" fill="url(#emblemBg)" stroke="url(#brassBorder)" stroke-width="4"/>
              <rect x="18" y="18" width="164" height="164" rx="32" fill="none" stroke="rgba(212,175,55,0.3)" stroke-width="1.5"/>
              <polygon points="40,20 62,92 18,92" fill="#8c1e17" opacity="0.95"/>
              <polygon points="80,20 102,92 58,92" fill="#dfd1b3" opacity="0.95"/>
              <polygon points="120,20 142,92 98,92" fill="#8c1e17" opacity="0.95"/>
              <polygon points="160,20 182,92 138,92" fill="#dfd1b3" opacity="0.95"/>
              <polygon points="40,180 62,108 18,108" fill="#dfd1b3" opacity="0.95"/>
              <polygon points="80,180 102,108 58,108" fill="#8c1e17" opacity="0.95"/>
              <polygon points="120,180 142,108 98,108" fill="#dfd1b3" opacity="0.95"/>
              <polygon points="160,180 182,108 138,108" fill="#8c1e17" opacity="0.95"/>
              <line x1="100" y1="20" x2="100" y2="180" stroke="#2d1408" stroke-width="6" opacity="0.6"/>
              <g filter="url(#checkerShadow)">
                <circle cx="76" cy="100" r="30" fill="url(#onyxShade)" stroke="#4a4d53" stroke-width="2"/>
                <circle cx="76" cy="100" r="21" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
                <circle cx="76" cy="100" r="10" fill="none" stroke="rgba(212,175,55,0.4)" stroke-width="1"/>
              </g>
              <g filter="url(#checkerShadow)">
                <circle cx="124" cy="100" r="30" fill="url(#ivoryShade)" stroke="#b8ab8b" stroke-width="2"/>
                <circle cx="124" cy="100" r="21" fill="none" stroke="rgba(138,120,90,0.45)" stroke-width="1.5"/>
                <circle cx="124" cy="100" r="10" fill="none" stroke="rgba(212,175,55,0.6)" stroke-width="1"/>
              </g>
            </svg>
          </div>
          <div class="game-meta">
            <h2>Backgammon</h2>
            <p id="card-desc-bg">サイコロと戦略の伝統ボードゲーム</p>
          </div>
        </div>
      </a>
    </div>
  </main>

  <!-- ⚙️ 設定モーダル -->
  <div id="settings-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modal-settings-title">⚙️ 設定</h2>
        <button id="btn-close-modal" class="close-x-btn" type="button">✕</button>
      </div>
      
      <div class="modal-body">
        <div class="setting-row">
          <label id="lbl-lang">言語 (Language)</label>
          <select id="select-lang" class="custom-select">
            <option value="ja">日本語</option>
            <option value="en">English</option>
            <option value="zh-CN">简体中文</option>
            <option value="zh-TW">繁體中文</option>
            <option value="ko">한국어</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
            <option value="pt">Português</option>
          </select>
        </div>

        <div class="setting-row">
          <label id="lbl-sound">効果音 (Sound FX)</label>
          <div class="btn-group">
            <button id="btn-sound-on" class="toggle-choice-btn" type="button">ON</button>
            <button id="btn-sound-off" class="toggle-choice-btn" type="button">OFF</button>
          </div>
        </div>

        <div class="setting-row">
          <label id="lbl-vib">振動 (Vibration)</label>
          <div class="btn-group">
            <button id="btn-vib-on" class="toggle-choice-btn" type="button">ON</button>
            <button id="btn-vib-off" class="toggle-choice-btn" type="button">OFF</button>
          </div>
        </div>

        <div class="setting-row">
          <label id="lbl-speed">アニメーション速度</label>
          <div class="btn-group">
            <button id="btn-speed-normal" class="toggle-choice-btn" type="button">通常</button>
            <button id="btn-speed-fast" class="toggle-choice-btn" type="button">高速</button>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button id="btn-modal-close-bottom" class="primary-btn" type="button">とじる</button>
      </div>
    </div>
  </div>

    class ClubHouseApp {
      constructor() {
        this.currentLang = localStorage.getItem('2048_lang') || localStorage.getItem('clubhouse_lang') || 'ja';
        this.isMuted = (localStorage.getItem('2048_muted') || localStorage.getItem('clubhouse_muted')) === 'true';
        this.isVib = (localStorage.getItem('2048_vibration') || localStorage.getItem('clubhouse_vibration')) !== 'false';
        this.speed = localStorage.getItem('2048_speed') || localStorage.getItem('clubhouse_speed') || 'normal';

        this.initDOMElements();
        this.applyLanguage();
        this.updateSettingsUI();
        this.bindEvents();
      }

      initDOMElements() {
        this.titleText = document.getElementById('title-text');
        this.descText = document.getElementById('desc-text');
        this.desc2048 = document.getElementById('card-desc-2048');
        this.descBg = document.getElementById('card-desc-bg');

        this.modal = document.getElementById('settings-modal');
        this.btnSettingsOpen = document.getElementById('btn-settings-open');
        this.btnCloseModal = document.getElementById('btn-close-modal');
        this.btnCloseBottom = document.getElementById('btn-modal-close-bottom');

        this.selectLang = document.getElementById('select-lang');
        this.btnSoundOn = document.getElementById('btn-sound-on');
        this.btnSoundOff = document.getElementById('btn-sound-off');
        this.btnVibOn = document.getElementById('btn-vib-on');
        this.btnVibOff = document.getElementById('btn-vib-off');
        this.btnSpeedNormal = document.getElementById('btn-speed-normal');
        this.btnSpeedFast = document.getElementById('btn-speed-fast');

        this.settingsTitle = document.getElementById('modal-settings-title');
        this.lblLang = document.getElementById('lbl-lang');
        this.lblSound = document.getElementById('lbl-sound');
        this.lblVib = document.getElementById('lbl-vib');
        this.lblSpeed = document.getElementById('lbl-speed');
      }

      applyLanguage() {
        const t = I18N[this.currentLang] || I18N.ja;
        document.documentElement.lang = this.currentLang;

        if (this.titleText)
