<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Oh LOVE games - CLUB HOUSE</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <style>
    /* アイコン用SVG調整 */
    .game-icon-box svg {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 12px;
    }

    /* 歯車ボタンのクリック判定を最大化 */
    .gear-btn {
      position: relative;
      z-index: 1000;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
    }

    /* モーダル表示の完全強制上書き */
    #settings-modal {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.8);
      z-index: 999999 !important;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <!-- ヘッダー（右上に歯車ボタン） -->
  <header>
    <div class="brand-title">Oh LOVE games</div>
    <div class="header-right">
      <button id="btn-settings-open" class="gear-btn" type="button" aria-label="Settings" onclick="openClubModal()">⚙️</button>
    </div>
  </header>

  <!-- メイン画面 -->
  <main>
    <div class="hero">
      <div class="club-symbol">
        <svg viewBox="0 0 100 100" class="symbol-svg">
          <circle cx="50" cy="50" r="46" fill="none" stroke="#e2a85c" stroke-width="3" opacity="0.3"/>
          <path d="M50 20 C36 20 26 30 26 43 C26 53 34 61 43 64 L38 80 L62 80 L57 64 C66 61 74 53 74 43 C74 30 64 20 50 20 Z" fill="#e2a85c"/>
          <circle cx="33" cy="44" r="11" fill="#e2a85c"/>
          <circle cx="67" cy="44" r="11" fill="#e2a85c"/>
        </svg>
      </div>
      <h1 id="title-text">CLUB HOUSE</h1>
      <p id="desc-text" class="subtitle">Board Game &amp; Puzzle Collection</p>
    </div>

    <!-- ゲーム選択カード -->
    <div class="game-grid">
      <!-- 1. 2048 -->
      <a href="2048/index.html" class="game-card">
        <div class="card-inner">
          <div class="game-icon-box">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
              <defs>
                <radialGradient id="bg-2048" cx="50%" cy="20%" r="80%">
                  <stop offset="0%" stop-color="#fffdfa"/>
                  <stop offset="100%" stop-color="#e2d6c3"/>
                </radialGradient>
                <linearGradient id="tile-2048" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#f3cb42"/>
                  <stop offset="100%" stop-color="#e8be23"/>
                </linearGradient>
                <filter id="shadow-2048" x="-10%" y="-10%" width="130%" height="130%">
                  <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#ca9f10" flood-opacity="0.45"/>
                </filter>
              </defs>
              <rect width="512" height="512" rx="112" fill="url(#bg-2048)"/>
              <rect x="76" y="76" width="360" height="360" rx="64" fill="#ca9f10"/>
              <rect x="76" y="64" width="360" height="360" rx="64" fill="url(#tile-2048)" filter="url(#shadow-2048)"/>
              <text x="256" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="110" fill="#ffffff" text-anchor="middle" letter-spacing="-3">2048</text>
            </svg>
          </div>
          <div class="game-meta">
            <h2>2048</h2>
            <p id="card-desc-2048">Merge tiles to reach the legend.</p>
          </div>
        </div>
      </a>

      <!-- 2. バックギャモン -->
      <a href="backgammon/index.html" class="game-card">
        <div class="card-inner">
          <div class="game-icon-box">
            <svg class="title-symbol-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <radialGradient id="emblemBg" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="#1e4e32"/>
                  <stop offset="70%" stop-color="#143521"/>
                  <stop offset="100%" stop-color="#0a1c11"/>
                </radialGradient>
                <linearGradient id="brassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#fff2b2"/>
                  <stop offset="35%" stop-color="#d4af37"/>
                  <stop offset="70%" stop-color="#8a671c"/>
                  <stop offset="100%" stop-color="#e8ca74"/>
                </linearGradient>
                <radialGradient id="ivoryShade" cx="35%" cy="30%" r="70%">
                  <stop offset="0%" stop-color="#ffffff"/>
                  <stop offset="65%" stop-color="#eee6d3"/>
                  <stop offset="100%" stop-color="#b8aa88"/>
                </radialGradient>
                <radialGradient id="onyxShade" cx="35%" cy="30%" r="70%">
                  <stop offset="0%" stop-color="#464a52"/>
                  <stop offset="60%" stop-color="#1c1e22"/>
                  <stop offset="100%" stop-color="#08090a"/>
                </radialGradient>
                <filter id="checkerShadow" x="-30%" y="-30%" width="160%" height="160%">
                  <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.65"/>
                </filter>
              </defs>
              <rect x="10" y="10" width="180" height="180" rx="40" fill="url(#emblemBg)" stroke="url(#brassBorder)" stroke-width="4"/>
              <rect x="18" y="18" width="164" height="164" rx="32" fill="none" stroke="rgba(212,175,55,0.3)" stroke-width="1.5"/>
              <polygon points="40,20 62,92 18,92" fill="#8c1e17" opacity="0.95"/>
              <polygon points="80,20 102,92 58,92" fill="#dfd1b3" opacity="0.95"/>
              <polygon points="120,20 142,92 98,92" fill="#8c1e17" opacity="0.95"/>
              <polygon points="160,20 182,92 138,92" fill="#dfd1b3" opacity="0.95"/>
              <polygon points="40,180 62,108 18,108" fill="#dfd1b3" opacity="0.95"/>
              <polygon points="80,180 102,108 58,108" fill="#8c1e17" opacity="0.95"/>
              <polygon points="120,180 142,108 98,108" fill="#dfd1b3" opacity="0.95"/>
              <polygon points="160,180 182,108 138,108" fill="#8c1e17" opacity="0.95"/>
              <line x1="100" y1="20" x2="100" y2="180" stroke="#2d1408" stroke-width="6" opacity="0.6"/>
              <g filter="url(#checkerShadow)">
                <circle cx="76" cy="100" r="30" fill="url(#onyxShade)" stroke="#4a4d53" stroke-width="2"/>
                <circle cx="76" cy="100" r="21" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
                <circle cx="76" cy="100" r="10" fill="none" stroke="rgba(212,175,55,0.4)" stroke-width="1"/>
              </g>
              <g filter="url(#checkerShadow)">
                <circle cx="124" cy="100" r="30" fill="url(#ivoryShade)" stroke="#b8ab8b" stroke-width="2"/>
                <circle cx="124" cy="100" r="21" fill="none" stroke="rgba(138,120,90,0.45)" stroke-width="1.5"/>
                <circle cx="124" cy="100" r="10" fill="none" stroke="rgba(212,175,55,0.6)" stroke-width="1"/>
              </g>
            </svg>
          </div>
          <div class="game-meta">
            <h2>Backgammon</h2>
            <p id="card-desc-bg">Classic dice &amp; strategy board game.</p>
          </div>
        </div>
      </a>
    </div>
  </main>

  <!-- ⚙️ 設定モーダル -->
  <div id="settings-modal" onclick="if(event.target === this) closeClubModal()">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modal-settings-title">⚙️ Settings</h2>
        <button id="btn-close-modal" class="close-x-btn" type="button" onclick="closeClubModal()">✕</button>
      </div>
      
      <div class="modal-body">
        <div class="setting-row">
          <label id="lbl-lang">Language</label>
          <select id="select-lang" class="custom-select">
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="zh-CN">简体中文</option>
            <option value="zh-TW">繁體中文</option>
            <option value="ko">한국어</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
            <option value="pt">Português</option>
          </select>
        </div>

        <div class="setting-row">
          <label id="lbl-sound">Sound FX</label>
          <div class="btn-group">
            <button id="btn-sound-on" class="toggle-choice-btn" type="button">ON</button>
            <button id="btn-sound-off" class="toggle-choice-btn" type="button">OFF</button>
          </div>
        </div>

        <div class="setting-row">
          <label id="lbl-vib">Vibration</label>
          <div class="btn-group">
            <button id="btn-vib-on" class="toggle-choice-btn" type="button">ON</button>
            <button id="btn-vib-off" class="toggle-choice-btn" type="button">OFF</button>
          </div>
        </div>

        <div class="setting-row">
          <label id="lbl-speed">Animation Speed</label>
          <div class="btn-group">
            <button id="btn-speed-normal" class="toggle-choice-btn" type="button">Normal</button>
            <button id="btn-speed-fast" class="toggle-choice-btn" type="button">Fast</button>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button id="btn-modal-close-bottom" class="primary-btn" type="button" onclick="closeClubModal()">Close</button>
      </div>
    </div>
  </div>

  <script>
    const I18N = {
      en: {
        title: 'CLUB HOUSE', subtitle: 'Board Game & Puzzle Collection',
        desc2048: 'Merge tiles to reach the legend.', descBg: 'Classic dice & strategy board game.',
        settingsTitle: '⚙️ Settings', langLabel: 'Language',
        soundLabel: 'Sound FX', vibLabel: 'Vibration',
        speedLabel: 'Animation Speed', speedNormal: 'Normal', speedFast: 'Fast', close: 'Close'
      },
      ja: {
        title: 'CLUB HOUSE', subtitle: 'ボードゲーム・パズルコレクション',
        desc2048: 'タイルを重ねて伝説の数字を目指すパズル', descBg: 'サイコロと戦略の伝統ボードゲーム',
        settingsTitle: '⚙️ 設定', langLabel: '言語 (Language)',
        soundLabel: '効果音 (Sound FX)', vibLabel: '振動 (Vibration)',
        speedLabel: 'アニメーション速度', speedNormal: '通常', speedFast: '高速', close: 'とじる'
      },
      'zh-CN': {
        title: 'CLUB HOUSE', subtitle: '桌游与益智游戏馆',
        desc2048: '合并方块，挑战传说中的数字。', descBg: '骰子与策略的经典双陆棋。',
        settingsTitle: '⚙️ 设置', langLabel: '语言',
        soundLabel: '音效', vibLabel: '震动',
        speedLabel: '动画速度', speedNormal: '正常', speedFast: '快速', close: '关闭'
      },
      'zh-TW': {
        title: 'CLUB HOUSE', subtitle: '桌遊與益智遊戲館',
        desc2048: '合併方塊，挑戰傳說中的數字。', descBg: '骰子與策略的經典雙陸棋。',
        settingsTitle: '⚙️ 設定', langLabel: '語言',
        soundLabel: '音效', vibLabel: '震動',
        speedLabel: '動畫速度', speedNormal: '正常', speedFast: '快速', close: '關閉'
      },
      ko: {
        title: 'CLUB HOUSE', subtitle: '보드게임 & 퍼즐 컬렉션',
        desc2048: '타일을 합쳐 전설의 숫자에 도달하세요.', descBg: '주사위와 전략의 전통 보드게임.',
        settingsTitle: '⚙️ 설정', langLabel: '언어',
        soundLabel: '효과음', vibLabel: '진동',
        speedLabel: '애니메이션 속도', speedNormal: '보통', speedFast: '빠름', close: '닫기'
      },
      es: {
        title: 'CLUB HOUSE', subtitle: 'Colección de Juegos de Mesa y Puzzles',
        desc2048: 'Combina fichas para alcanzar la leyenda.', descBg: 'Juego de mesa clásico de dados y estrategia.',
        settingsTitle: '⚙️ Ajustes', langLabel: 'Idioma',
        soundLabel: 'Efectos de sonido', vibLabel: 'Vibración',
        speedLabel: 'Velocidad', speedNormal: 'Normal', speedFast: 'Rápido', close: 'Cerrar'
      },
      fr: {
        title: 'CLUB HOUSE', subtitle: 'Collection de Jeux de Société et Casse-têtes',
        desc2048: 'Fusionnez les tuiles pour atteindre la légende.', descBg: 'Jeu de dés et de stratégie classique.',
        settingsTitle: '⚙️ Paramètres', langLabel: 'Langue',
        soundLabel: 'Effets sonores', vibLabel: 'Vibration',
        speedLabel: 'Vitesse', speedNormal: 'Normale', speedFast: 'Rapide', close: 'Fermer'
      },
      pt: {
        title: 'CLUB HOUSE', subtitle: 'Coleção de Jogos de Tabuleiro e Enigmas',
        desc2048: 'Junte as peças até alcançar a lendária.', descBg: 'Jogo clássico de dados e estratégia.',
        settingsTitle: '⚙️ Configurações', langLabel: 'Idioma',
        soundLabel: 'Efeitos sonoros', vibLabel: 'Vibration',
        speedLabel: 'Velocidade', speedNormal: 'Normal', speedFast: 'Rápido', close: 'Fechar'
      }
    };

    // デフォルト言語を 'en' に設定
    let currentLang = localStorage.getItem('clubhouse_lang') || localStorage.getItem('2048_lang') || localStorage.getItem('bg_lang') || 'en';
    let isMuted = (localStorage.getItem('clubhouse_muted') || localStorage.getItem('2048_muted')) === 'true';
    let isVib = (localStorage.getItem('clubhouse_vibration') || localStorage.getItem('2048_vibration')) !== 'false';
    let speed = localStorage.getItem('clubhouse_speed') || localStorage.getItem('2048_speed') || 'normal';

    function openClubModal() {
      const modal = document.getElementById('settings-modal');
      if (modal) modal.style.display = 'flex';
    }

    function closeClubModal() {
      const modal = document.getElementById('settings-modal');
      if (modal) modal.style.display = 'none';
    }

    function syncAllSettings() {
      ['clubhouse', '2048', 'bg'].forEach(prefix => {
        localStorage.setItem(`${prefix}_lang`, currentLang);
        localStorage.setItem(`${prefix}_muted`, isMuted);
        localStorage.setItem(`${prefix}_vibration`, isVib);
        localStorage.setItem(`${prefix}_speed`, speed);
      });
    }

    function renderClubUI() {
      const t = I18N[currentLang] || I18N.en;
      document.documentElement.lang = currentLang;

      document.getElementById('title-text').textContent = t.title;
      document.getElementById('desc-text').textContent = t.subtitle;
      document.getElementById('card-desc-2048').textContent = t.desc2048;
      document.getElementById('card-desc-bg').textContent = t.descBg;

      document.getElementById('modal-settings-title').textContent = t.settingsTitle;
      document.getElementById('lbl-lang').textContent = t.langLabel;
      document.getElementById('lbl-sound').textContent = t.soundLabel;
      document.getElementById('lbl-vib').textContent = t.vibLabel;
      document.getElementById('lbl-speed').textContent = t.speedLabel;
      document.getElementById('btn-speed-normal').textContent = t.speedNormal;
      document.getElementById('btn-speed-fast').textContent = t.speedFast;
      document.getElementById('btn-modal-close-bottom').textContent = t.close;

      document.getElementById('select-lang').value = currentLang;
      document.getElementById('btn-sound-on').classList.toggle('active', !isMuted);
      document.getElementById('btn-sound-off').classList.toggle('active', isMuted);
      document.getElementById('btn-vib-on').classList.toggle('active', isVib);
      document.getElementById('btn-vib-off').classList.toggle('active', !isVib);
      document.getElementById('btn-speed-normal').classList.toggle('active', speed === 'normal');
      document.getElementById('btn-speed-fast').classList.toggle('active', speed === 'fast');
    }

    // イベント登録
    document.getElementById('select-lang').addEventListener('change', (e) => {
      currentLang = e.target.value;
      syncAllSettings();
      renderClubUI();
    });

    document.getElementById('btn-sound-on').addEventListener('click', () => { isMuted = false; syncAllSettings(); renderClubUI(); });
    document.getElementById('btn-sound-off').addEventListener('click', () => { isMuted = true; syncAllSettings(); renderClubUI(); });

    document.getElementById('btn-vib-on').addEventListener('click', () => {
      isVib = true;
      syncAllSettings();
      renderClubUI();
      if ('vibrate' in navigator) navigator.vibrate(10);
    });
    document.getElementById('btn-vib-off').addEventListener('click', () => { isVib = false; syncAllSettings(); renderClubUI(); });

    document.getElementById('btn-speed-normal').addEventListener('click', () => { speed = 'normal'; syncAllSettings(); renderClubUI(); });
    document.getElementById('btn-speed-fast').addEventListener('click', () => { speed = 'fast'; syncAllSettings(); renderClubUI(); });

    renderClubUI();
  </script>
</body>
</html>
